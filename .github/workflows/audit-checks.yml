name: Teacher Care audit checks

on:
  workflow_dispatch:
  push:
    branches:
      - audit/independent-source-crosscheck-20261023
    paths:
      - '.github/workflows/audit-checks.yml'
      - 'data/**'
      - 'tools/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'docs/official-source-spotcheck-2026-10-23.md'

permissions:
  contents: read

jobs:
  data:
    name: Data integrity and future-date checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and references (current date)
        run: node tools/check-data.js --json=audit-data-current.json
      - name: Validate future-date expiry warning baseline
        run: |
          CHECK_TODAY=2027-01-02 node tools/check-data.js --json=audit-data-2027-01-02.json
          CHECK_TODAY=2027-03-02 node tools/check-data.js --json=audit-data-2027-03-02.json
      - name: Publish data check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-care-data-audit
          path: audit-data-*.json
          if-no-files-found: warn

  links:
    name: Official source links (external network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official source links
        run: node tools/check-links.js --json=audit-links.json
      - name: Publish URL check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-care-link-audit
          path: audit-links.json
          if-no-files-found: warn
